name: Build installable APK (no fees, no keys)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK
        shell: bash
        run: |
          set -euxo pipefail

          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Prepare web assets
        run: mkdir -p dist/client && bunx cap sync android

      - name: Build installable APK
        working-directory: android
        run: JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64 ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: lila-installable-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
